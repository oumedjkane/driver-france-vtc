
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver France - VTC</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f4f7;
  color:#222;
}

.container{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.header{
  background:#111;
  color:white;
  padding:22px;
  border-radius:18px;
  text-align:center;
  margin-bottom:18px;
}

.header h1{
  margin:0;
  font-size:30px;
}

.header p{
  margin:8px 0 0;
  color:#ddd;
}

.card{
  background:white;
  padding:20px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 3px 12px #0001;
}

label{
  display:block;
  font-weight:bold;
  margin:12px 0 6px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.calculate{
  background:#111;
  color:white;
  margin-top:18px;
}

.result{
  display:none;
  background:#f5f5f5;
  padding:18px;
  border-radius:12px;
  margin-top:18px;
}

.price{
  font-size:30px;
  font-weight:bold;
  text-align:center;
  margin:10px 0;
}

.book{
  background:#16803c;
  color:white;
  margin-top:12px;
}

.airport{
  background:#eee;
  color:#222;
  margin-top:10px;
}

.footer{
  text-align:center;
  color:#777;
  font-size:13px;
  margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🚗 Driver France</h1>
    <p>Votre chauffeur VTC privé</p>
  </div>

  <div class="card">

    <h2>Réserver votre trajet</h2>

    <label>📍 Départ</label>
    <input id="depart" type="text" placeholder="Adresse de départ">

    <label>📍 Destination</label>
    <input id="destination" type="text" placeholder="Adresse d'arrivée">

    <label>📅 Date</label>
    <input id="date" type="date">

    <label>🕐 Heure</label>
    <input id="heure" type="time">

    <label>👤 Passagers</label>
    <select id="passagers">
      <option>1</option>
      <option>2</option>
      <option>3</option>
      <option>4</option>
      <option>5</option>
      <option>6</option>
      <option>7</option>
    </select>

    <label>🚘 Type de véhicule</label>
    <select id="vehicule">
      <option>Berline</option>
      <option>Van</option>
    </select>

    <label>🛣️ Distance du trajet (km)</label>
    <input id="distance" type="number" min="1" placeholder="Exemple : 25">

    <label>💳 Mode de paiement</label>
    <select id="paiement">
      <option>Carte bancaire</option>
      <option>Espèces</option>
    </select>

    <button class="airport" onclick="airportPrice()">
      ✈️ Transfert aéroport - 28 €
    </button>

    <button class="calculate" onclick="calculer()">
      Calculer le prix
    </button>

    <div class="result" id="result">
      <div>Distance : <b id="km"></b> km</div>
      <div class="price" id="prix"></div>
      <div id="details"></div>

      <button class="book" onclick="reserver()">
        📲 Demander la réservation
      </button>
    </div>

  </div>

  <div class="card">
    <h3>🌍 Zones desservies</h3>
    <p>🇫🇷 France</p>
    <p>🇩🇪 Allemagne</p>
    <p>🇨🇭 Suisse</p>
  </div>

  <div class="footer">
    Driver France VTC<br>
    Strasbourg • France • Allemagne • Suisse
  </div>

</div>

<script>

function calculer(){

  let depart = document.getElementById("depart").value;
  let destination = document.getElementById("destination").value;
  let distance = parseFloat(document.getElementById("distance").value);

  if(!depart || !destination || !distance){
    alert("Veuillez renseigner le départ, la destination et la distance.");
    return;
  }

  let prix = distance * 2;

  document.getElementById("km").textContent = distance;
  document.getElementById("prix").textContent =
    prix.toFixed(2) + " €";

  document.getElementById("details").innerHTML =
    "Tarif : 2 € / km<br>" +
    "Départ : " + depart + "<br>" +
    "Destination : " + destination;

  document.getElementById("result").style.display = "block";
}

function airportPrice(){

  document.getElementById("prix").textContent = "28 €";
  document.getElementById("km").textContent = "Forfait";

  document.getElementById("details").innerHTML =
    "✈️ Transfert aéroport<br>" +
    "Forfait : 28 €";

  document.getElementById("result").style.display = "block";
}

function reserver(){

  let depart = document.getElementById("depart").value;
  let destination = document.getElementById("destination").value;
  let date = document.getElementById("date").value;
  let heure = document.getElementById("heure").value;
  let passagers = document.getElementById("passagers").value;
  let paiement = document.getElementById("paiement").value;
  let prix = document.getElementById("prix").textContent;

  let message =
    "Bonjour, je souhaite réserver un VTC.%0A%0A" +
    "Départ : " + depart + "%0A" +
    "Destination : " + destination + "%0A" +
    "Date : " + date + "%0A" +
    "Heure : " + heure + "%0A" +
    "Passagers : " + passagers + "%0A" +
    "Paiement : " + paiement + "%0A" +
    "Prix estimé : " + prix;

  window.location.href =
    "https://wa.me/33668181849?text=" + message;
}

</script>

</body>
</html>
